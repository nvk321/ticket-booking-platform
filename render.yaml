services:
  - type: web
    name: ticketflow-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ticketflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEAT_HOLD_TTL_MINUTES
        value: "5"
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: "15"
      - key: EMAIL_PROVIDER
        value: "mock"

databases:
  - name: ticketflow-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
